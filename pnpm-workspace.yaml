# pnpm settings. Not a workspace definition — pnpm 11 stopped reading the `pnpm` field in
# package.json and reads non-auth settings only from here, so this file exists even though
# lindo-md is a single package. `.npmrc` is registry/auth only now.

# Which dependencies may run install scripts. Everything else is blocked, which is the single
# most valuable supply-chain control available: a compromised transitive package cannot execute
# anything at install time unless it is named here. esbuild is listed because it downloads its
# platform binary in a postinstall.
#
# `allowBuilds` replaces pnpm 10's `onlyBuiltDependencies`; the shape changed from an array to a
# map, so a mechanical copy of the old value silently allows nothing.
allowBuilds:
  esbuild: true

# Refuse to resolve a version published less than seven days ago (the value is in
# minutes). Every large npm compromise of the last few years — chalk/debug, the
# Shai-Hulud waves — was caught and unpublished well inside a week, so the delay
# converts "we install it the minute it lands" into "someone else finds it first".
#
# This is a CI gate as well as a resolution rule, which is easy to get wrong: pnpm 11
# re-verifies every entry in an existing lockfile against the policy, so
# `pnpm install --frozen-lockfile` fails on a lockfile containing anything too young.
# A stale lockfile therefore breaks the build rather than quietly passing.
#
# The entries below are written by pnpm itself, not by hand. When `minimumReleaseAge`
# was first switched on, `shiki@4.4.1` was five days old and `^4.4.1` admitted nothing
# older, so pnpm recorded the exact versions it had to accept. They are pinned to the
# version, so they lapse the moment shiki moves — which makes the list a record of
# knowingly-accepted young packages rather than a permanent hole.
#
# **Reasoning goes here, not beside the entries.** pnpm rewrites that list wholesale on
# every install: the comment that used to sit above the `brace-expansion` lines was
# silently eaten when `mermaid` was added, and the two entries were rewritten into one
# `||` range at the same time. Anything written inline is lost the next time someone
# runs `pnpm install`.
#
# What is currently excluded, and why each was taken early:
#
#   * `shiki@4.4.1` — not a security fix. It was five days old when `minimumReleaseAge`
#     was switched on and `^4.4.1` admitted nothing older, so the alternative was an
#     unbuildable repo.
#   * `mermaid@11.16.1` — five advisories in 11.16.0: prototype pollution in the config
#     APIs (GHSA-c4c3-pg64-4m4v) and architecture diagrams (GHSA-3rrr-jr9j-h3q3), CSS
#     injection reaching siblings of the diagram (GHSA-6x64-9x62-f2gx), and DoS in radar
#     (GHSA-rhh3-jpg6-66xh) and XY charts (GHSA-2v8p-3f2j-5mp7). Published 2026-08-04 and
#     taken on 2026-08-07, three days inside the floor.
#
#     Taken early rather than waited out because of what mermaid *is* here: it parses
#     fence bodies out of arbitrary documents, which is this app's entire threat model,
#     and the alternative was shipping a desktop binary with all five baked in. A
#     statically linked app has no server to patch afterwards. This is the case the
#     "security fixes bypass the delay" rule in AGENTS.md exists for — a known-good fix
#     for a known-bad version, which is the opposite of what the floor guards against.
#
# --- Why this list keeps shrinking -------------------------------------------
#
# `nanoid`, `brace-expansion` and `dompurify` were all on the list above and are all off
# it now. None of the three aged out quietly, and the three ways they left are worth
# keeping because each one turned the daily scan red on a tree nobody had touched:
#
#   * `nanoid` — **the advisory's fixed version moved.** CVE-2026-67213 was published
#     naming 3.3.17 as the 3.x fix, 3.3.17 was excluded here on 2026-08-03 to take it
#     early, and the advisory was revised on 2026-08-13 to say the fix is 3.3.18. The
#     version taken as the remedy became the version flagged.
#   * `brace-expansion` — **new advisories against the fixed version.** 1.1.18 and 5.0.9
#     were taken for GHSA-rgw5-rvv9-x895. On 2026-09-29 three more landed against exactly
#     those versions — two stack-exhaustion recursions and a quadratic expansion
#     (GHSA-6j4f-fj2g-mc7p, GHSA-qhr7-859c-m2p7, GHSA-q2hr-2g5m-vwhr). Different bugs in
#     the same parser, so the remedy was simply superseded.
#   * `dompurify` — **the fix introduced the next bug.** 3.4.13 was taken on 2026-08-09
#     for GHSA-55q2-fjhq-7xh7, an `IN_PLACE` hook leaving a detached subtree executable.
#     GHSA-p98j-92pf-mc4p records `3.4.13` as its *introduced* version: the same hook
#     family, the same detached-subtree shape, armed by the patch itself. Fixed in 3.4.16.
#
# All three replacements are months or weeks old, so each is a plain `overrides` bump with
# no exclusion beside it. That is the shape to expect: an exclusion is for the few days a
# fix is too young, and it should not outlive them.
#
# **Taking the named fix is not a durable state.** It is a snapshot of what the database
# said that day, and the database moves under a tree that does not — by revising a range,
# by flagging the version you landed on, or by finding the bug your patch introduced. A
# green scan on the day of the fix is not a promise the same tree stays green; the daily
# run is what notices, so it is worth keeping green rather than letting it go red for
# three weeks and be rediscovered.
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - "@shikijs/core@4.4.1"
  - "@shikijs/engine-javascript@4.4.1"
  - "@shikijs/engine-oniguruma@4.4.1"
  - "@shikijs/langs@4.4.1"
  - "@shikijs/primitive@4.4.1"
  - "@shikijs/themes@4.4.1"
  - "@shikijs/types@4.4.1"
  - "shiki@4.4.1"
  - mermaid@11.16.1

# When *no* version inside a declared range is old enough, install the newest anyway
# rather than failing. This only ever fires when the whole range is young — the normal
# case, a freshly published malicious patch with older siblings available, still gets
# the delay, because pnpm picks the newest version that does qualify.
#
# Left at the default `true` the repo becomes unbuildable whenever a direct dependency
# publishes inside the window and `^x.y.z` admits nothing earlier: `shiki@4.4.1` is
# exactly that, and it made `pnpm install --frozen-lockfile` fail outright.
minimumReleaseAgeStrict: false

# Why an override at all: for every entry here the dependent's declared range *already*
# permits the fixed version — mermaid asks for `dompurify@^3.3.3`, postcss for
# `nanoid@^3.3.16`, ESLint's chain for a `brace-expansion` major. Nothing is blocking the
# upgrade. What holds it back is that pnpm resolves to the newest version satisfying the
# range it already locked, which is still the vulnerable one, so `pnpm update` moves
# nothing and reports success. The override is what names the version.
#
# A matching `minimumReleaseAgeExclude` entry is needed *only* while the fix is younger
# than the floor; without it the override is silently a no-op. Every fix currently named
# here is weeks or months old, so none of them has one. See the note above that list for
# what happened to the three that did.
#
# `brace-expansion` is bounded on both sides, which matters and is easy to get wrong. An
# open `>=1.1.21` is not a patch — it satisfies 5.x too, so pnpm resolved a v1 request up
# to a v5 release and left the vulnerable version in the tree anyway. Each line is pinned
# to its own major.
#
# The versions below are the *second* round for this package. 1.1.18 / 5.0.9 were taken
# for GHSA-rgw5-rvv9-x895; three further advisories landed on 2026-09-29 against exactly
# those versions, and each names a different fixed version per major line
# (1.1.19/1.1.20/1.1.21 and 5.0.10/5.0.11/5.0.12, published minutes apart). Taking the
# highest of each covers all three — pinning to the first advisory's fix would have left
# the other two live, which is the trap in reading one advisory at a time.
# `katex` is the awkward one, for two reasons worth writing down.
#
# First, the obvious override is wrong. CVE-2026-103923 names 0.18.2 as the fix, but
# `katex@<0.18.2: "^0.18.2"` resolves to **0.18.11**, which npm marks deprecated:
# "Accidentally published with breaking changes. Use 0.19.0 instead." The caret range
# that satisfies the advisory walks straight into a release upstream has disowned, so the
# override names 0.19.0 instead. Reading the fixed version out of an advisory is not the
# same as knowing which version to take.
#
# Second, this one override moves a dependency past the range its dependent declares.
# There were two copies in the tree — the app's own, and 0.16.47 under mermaid — and the
# 0.16 line has no fix at all for this advisory: `introduced: 0.11.0, fixed: 0.18.2`.
# Mermaid 12.1.0 still asks for `katex@^0.16.47`, so waiting for mermaid does not help
# and upgrading mermaid does not either. Forcing 0.19.0 collapses both copies onto the
# fixed version at the cost of giving mermaid a katex it never asked for.
#
# That is only safe because the surface is tiny: mermaid calls exactly one katex API,
# `renderToString`, which was checked against 0.19.0 directly. The app's own call —
# `katex.render(..., { displayMode, throwOnError: false, output: "html" })` — now has
# tests in `render.test.ts`; before this change nothing in the suite called katex at all,
# so a breaking upgrade would have gone green. Re-check both if this override moves again.

overrides:
  brace-expansion@<1.1.21: "^1.1.21"
  brace-expansion@>=2 <5.0.12: "^5.0.12"
  dompurify@<3.4.16: "^3.4.16"
  katex@<0.19.0: "^0.19.0"
  nanoid@<3.3.18: "^3.3.18"
  smol-toml@<1.9.0: "^1.9.0"
  source-map-js@<1.2.2: "^1.2.2"
