# pnpm settings. Not a workspace definition — pnpm 11 stopped reading the `pnpm` field in
# package.json and reads non-auth settings only from here, so this file exists even though
# lindo-md is a single package. `.npmrc` is registry/auth only now.

# Which dependencies may run install scripts. Everything else is blocked, which is the single
# most valuable supply-chain control available: a compromised transitive package cannot execute
# anything at install time unless it is named here. esbuild is listed because it downloads its
# platform binary in a postinstall.
#
# `allowBuilds` replaces pnpm 10's `onlyBuiltDependencies`; the shape changed from an array to a
# map, so a mechanical copy of the old value silently allows nothing.
allowBuilds:
  esbuild: true

# Refuse to resolve a version published less than seven days ago (the value is in
# minutes). Every large npm compromise of the last few years — chalk/debug, the
# Shai-Hulud waves — was caught and unpublished well inside a week, so the delay
# converts "we install it the minute it lands" into "someone else finds it first".
#
# This is a CI gate as well as a resolution rule, which is easy to get wrong: pnpm 11
# re-verifies every entry in an existing lockfile against the policy, so
# `pnpm install --frozen-lockfile` fails on a lockfile containing anything too young.
# A stale lockfile therefore breaks the build rather than quietly passing.
#
# The entries below are written by pnpm itself, not by hand. When `minimumReleaseAge`
# was first switched on, `shiki@4.4.1` was five days old and `^4.4.1` admitted nothing
# older, so pnpm recorded the exact versions it had to accept. They are pinned to the
# version, so they lapse the moment shiki moves — which makes the list a record of
# knowingly-accepted young packages rather than a permanent hole.
#
# **Reasoning goes here, not beside the entries.** pnpm rewrites that list wholesale on
# every install: the comment that used to sit above the `brace-expansion` lines was
# silently eaten when `mermaid` was added, and the two entries were rewritten into one
# `||` range at the same time. Anything written inline is lost the next time someone
# runs `pnpm install`.
#
# What is currently excluded, and why each was taken early:
#
#   * `shiki@4.4.1` — not a security fix. It was five days old when `minimumReleaseAge`
#     was switched on and `^4.4.1` admitted nothing older, so the alternative was an
#     unbuildable repo.
#   * `brace-expansion@1.1.18 || 5.0.9` — GHSA-rgw5-rvv9-x895, CVSS 7.5, in both major
#     lines. Fixed versions were 6.4 days old; see `overrides` below.
#   * `mermaid@11.16.1` — five advisories in 11.16.0: prototype pollution in the config
#     APIs (GHSA-c4c3-pg64-4m4v) and architecture diagrams (GHSA-3rrr-jr9j-h3q3), CSS
#     injection reaching siblings of the diagram (GHSA-6x64-9x62-f2gx), and DoS in radar
#     (GHSA-rhh3-jpg6-66xh) and XY charts (GHSA-2v8p-3f2j-5mp7). Published 2026-08-04 and
#     taken on 2026-08-07, three days inside the floor.
#
#     Taken early rather than waited out because of what mermaid *is* here: it parses
#     fence bodies out of arbitrary documents, which is this app's entire threat model,
#     and the alternative was shipping a desktop binary with all five baked in. A
#     statically linked app has no server to patch afterwards. This is the case the
#     "security fixes bypass the delay" rule in AGENTS.md exists for — a known-good fix
#     for a known-bad version, which is the opposite of what the floor guards against.
#   * `dompurify@3.4.13` — GHSA-55q2-fjhq-7xh7, XSS: removing an `IN_PLACE` hook leaves a
#     detached subtree still executable. Transitive via mermaid, and therefore shipped.
#     v1.3.0 shipped 3.4.12 knowingly (it is pre-existing, so 1.3.0 was still strictly
#     better than what it replaced) on the understanding that 3.4.13 would be taken once
#     it cleared the floor. It clears on 2026-08-10; this was taken on 2026-08-09, with
#     under a day left to run, because the daily scan is red until it is.
#   * `nanoid@3.3.17` — CVE-2026-67213, infinite loop in `customAlphabet`/`customRandom`
#     when `size` is 0. Transitive via postcss <- vite, so it is a build-time dependency
#     and never reaches a user; nothing here calls those functions at all, let alone with
#     an attacker-supplied size. Taken with the dompurify fix rather than separately —
#     both were published 2026-08-03 and clear the floor within hours of each other, and
#     one PR that empties the scanner's queue beats two that each leave it half-red.
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - "@shikijs/core@4.4.1"
  - "@shikijs/engine-javascript@4.4.1"
  - "@shikijs/engine-oniguruma@4.4.1"
  - "@shikijs/langs@4.4.1"
  - "@shikijs/primitive@4.4.1"
  - "@shikijs/themes@4.4.1"
  - "@shikijs/types@4.4.1"
  - "shiki@4.4.1"
  - brace-expansion@1.1.18 || 5.0.9
  - mermaid@11.16.1
  - dompurify@3.4.13
  - nanoid@3.3.17

# When *no* version inside a declared range is old enough, install the newest anyway
# rather than failing. This only ever fires when the whole range is young — the normal
# case, a freshly published malicious patch with older siblings available, still gets
# the delay, because pnpm picks the newest version that does qualify.
#
# Left at the default `true` the repo becomes unbuildable whenever a direct dependency
# publishes inside the window and `^x.y.z` admits nothing earlier: `shiki@4.4.1` is
# exactly that, and it made `pnpm install --frozen-lockfile` fail outright.
minimumReleaseAgeStrict: false

# GHSA-rgw5-rvv9-x895, CVSS 7.5, in both major lines of `brace-expansion`. It arrived
# transitively with ESLint, and osv-scanner caught it on the first run of the workflow
# added in the same branch.
#
# Overridden rather than waited out: the fixed versions were 6.4 days old when this was
# written, so `minimumReleaseAge` would have refused them for another fifteen hours. A
# known-good fix for a known-bad version is the opposite of the situation the delay
# exists for, which is why both are listed in `minimumReleaseAgeExclude` above —
# pinned to the exact version, so the exception dies with it.
# Bounded on both sides. An open `>=1.1.18` is not a patch — it satisfies 5.x too, so
# pnpm happily resolved a v1 request up to a v5 release and the vulnerable 5.0.8 stayed
# in the tree. Each line is pinned to its own major.
#
# The two entries below are here for a different reason, and it is worth stating because
# the obvious fix does not work: for both packages the dependent's declared range already
# permits the fixed version (mermaid asks for `dompurify@^3.3.3`, postcss for
# `nanoid@^3.3.16`), so nothing is *blocking* the upgrade. What holds it back is the age
# floor — pnpm resolves to the newest version that satisfies it, which is still the
# vulnerable one, so `pnpm update` moves nothing and reports success. An override is what
# names the version; the `minimumReleaseAgeExclude` entries above are what let pnpm take
# it. Both halves are required, and each is silently a no-op without the other.
overrides:
  brace-expansion@<1.1.18: "^1.1.18"
  brace-expansion@>=2 <5.0.9: "^5.0.9"
  dompurify@<3.4.13: "^3.4.13"
  nanoid@<3.3.17: "^3.3.17"
