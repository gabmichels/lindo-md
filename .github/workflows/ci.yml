name: CI

# Prose-only changes skip the expensive jobs, but the workflow still runs.
#
# This used to be `paths-ignore` on the trigger, and the comment here used to warn that
# it was "only safe while main has no required status checks" — a skipped workflow
# reports nothing at all rather than success, so a required check waits for a report
# that never comes and the PR can never merge. Branch protection made that real, so the
# filter moved from the trigger into a job.
#
# The shape: `changes` decides, the expensive jobs are conditional on it, and `ci` is a
# single always-running gate that branch protection can require. A docs PR now costs two
# small jobs instead of nothing, which is the price of being able to require the check
# at all.
#
# Still `*.md` rather than `**/*.md`: the second form would also ignore
# `test/fixtures/kitchen-sink.md`, which is the input to the markdown snapshot tests.
# Editing that fixture must still run everything.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# CI only reads the repository. Declared explicitly because the default is whatever
# the repo setting says, which for a repo created before 2023 is read/write on every
# scope — a compromised action step could then push to main.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Did anything that is not prose change? `git diff` rather than a path-filter action:
  # one less third-party action in the trust boundary, for about ten lines of shell.
  changes:
    name: Detect prose-only changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Needed to diff against the base; a shallow clone has no merge base.
          fetch-depth: 0
          persist-credentials: false

      - id: filter
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi

          # A new branch, a force push, or a manual run gives no usable base. Run
          # everything: guessing wrong in that direction only costs minutes, and
          # guessing wrong in the other ships something untested.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]              || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "no usable base ($base) — running everything"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(git diff --name-only "$base" HEAD)
          echo "changed files:"; echo "$changed" | sed 's/^/  /'

          # Anything not matching the prose patterns counts as code.
          if echo "$changed" | grep -qvE '^([^/]*\.md|docs/.*|LICENSE)$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # Typecheck and unit tests are platform-independent, so run them once rather than
  # three times — the expensive matrix below is about proving the app *builds* everywhere.
  frontend:
    name: Typecheck & unit tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes; leaving credentials in .git/config only
          # widens what a later step could do with them.
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Ordered cheapest-first inside the one job rather than split into three:
      # `format:check` is seconds, `lint` is type-aware and takes minutes, and sharing
      # the job means one install rather than three.
      - run: pnpm format:check
      - run: pnpm lint
      # Dead code and dependencies nothing imports. Cheap, and it caught seven
      # unused packages the first time it ran.
      - run: pnpm knip
      - run: pnpm test

  rust:
    name: Rust tests (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes; leaving credentials in .git/config only
          # widens what a later step could do with them.
          persist-credentials: false

      # Path handling and the config directory differ per platform, and the markdown
      # snapshot tests must produce byte-identical HTML everywhere. Run on all three.
      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri

      # rustfmt is platform-independent by construction, so running it on all three
      # runners checks the same bytes three times. Clippy stays on the full matrix —
      # `cfg`-gated code genuinely can lint differently per platform.
      - name: Check formatting
        if: matrix.os == 'ubuntu-22.04'
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: src-tauri
        run: cargo test

  build:
    name: Build bundle (${{ matrix.os }})
    needs: [changes, frontend, rust]
    if: needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes; leaving credentials in .git/config only
          # widens what a later step could do with them.
          persist-credentials: false

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # Updater artifacts are switched off here, and only here.
      #
      # `bundle.createUpdaterArtifacts` is on in `tauri.conf.json`, and it makes the bundler
      # demand `TAURI_SIGNING_PRIVATE_KEY` — "a public key has been found, but no private key" —
      # *after* it has already produced the installer. So this job would build everything it is
      # meant to prove and then fail on the last step.
      #
      # Handing it the real key instead would be worse. This workflow runs on pull requests,
      # including from forks, where secrets are not available at all — so the fix would work for
      # us and break for the first outside contributor, which is the kind of asymmetry nobody
      # discovers until someone is already discouraged. And a release-signing key has no business
      # being reachable from a branch build.
      #
      # What this job exists to prove is that the app bundles on all three platforms. That is
      # unchanged. Signing is exercised by `release.yml`, which is the only place it means
      # anything, and `lib.rs` has a test that fails if `createUpdaterArtifacts` is ever flipped
      # off in the committed config rather than overridden here.
      - name: Build the app
        # bash on all three runners: this passes inline JSON to a native command, and quoting
        # that identically in PowerShell is a well-known way to lose the double quotes.
        shell: bash
        run: pnpm tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'

      # Kept on pull requests, because downloading a branch build and actually running it
      # is worth more than the storage. Shortened from the 90-day default: these are
      # throwaway checks, and the bundles anyone is meant to keep come from release.yml.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lindo-md-${{ matrix.os }}
          retention-days: 7
          path: |
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
          if-no-files-found: warn

  # The one check branch protection requires.
  #
  # `if: always()` so it reports even when everything upstream was skipped — that is the
  # entire point, and the reason `paths-ignore` had to go. "Skipped" counts as success;
  # anything else does not, including `cancelled`, which a plain `success()` would let
  # through as a non-failure.
  ci:
    name: CI
    if: always()
    needs: [changes, frontend, rust, build]
    runs-on: ubuntu-latest
    steps:
      - name: Every job succeeded or was deliberately skipped
        shell: bash
        run: |
          set -euo pipefail
          echo '${{ toJSON(needs) }}' | tee results.json
          if jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")' results.json > /dev/null; then
            echo "CI is green."
          else
            echo "::error::a required job did not succeed"
            jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "  \(.key): \(.value.result)"' results.json
            exit 1
          fi
