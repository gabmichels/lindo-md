name: CI

# `paths-ignore` is `*.md` rather than `**/*.md` on purpose: the second form would also
# ignore `test/fixtures/kitchen-sink.md`, which is the input to the markdown snapshot
# tests. Editing that fixture must still run CI. Only the root-level prose files —
# README, AGENTS, DESIGN, CLAUDE — are safe to skip.
#
# This is only safe while `main` has no required status checks. A skipped workflow
# reports nothing at all rather than success, so a required check would sit pending
# forever and block the PR. If branch protection is added, this needs the companion
# job that reports success for skipped paths.
on:
  push:
    branches: [main]
    # Duplicated below rather than shared: GitHub Actions does not support YAML anchors.
    paths-ignore: ["*.md", "docs/**", "LICENSE"]
  pull_request:
    paths-ignore: ["*.md", "docs/**", "LICENSE"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Typecheck and unit tests are platform-independent, so run them once rather than
  # three times — the expensive matrix below is about proving the app *builds* everywhere.
  frontend:
    name: Typecheck & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Ordered cheapest-first inside the one job rather than split into three:
      # `format:check` is seconds, `lint` is type-aware and takes minutes, and sharing
      # the job means one install rather than three.
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm test

  rust:
    name: Rust tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # Path handling and the config directory differ per platform, and the markdown
      # snapshot tests must produce byte-identical HTML everywhere. Run on all three.
      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # rustfmt is platform-independent by construction, so running it on all three
      # runners checks the same bytes three times. Clippy stays on the full matrix —
      # `cfg`-gated code genuinely can lint differently per platform.
      - name: Check formatting
        if: matrix.os == 'ubuntu-22.04'
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: src-tauri
        run: cargo test

  build:
    name: Build bundle (${{ matrix.os }})
    needs: [frontend, rust]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - name: Build the app
        run: pnpm tauri build

      # Kept on pull requests, because downloading a branch build and actually running it
      # is worth more than the storage. Shortened from the 90-day default: these are
      # throwaway checks, and the bundles anyone is meant to keep come from release.yml.
      - uses: actions/upload-artifact@v7
        with:
          name: lindo-md-${{ matrix.os }}
          retention-days: 7
          path: |
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.dmg
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe
          if-no-files-found: warn
