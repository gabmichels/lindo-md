name: Supply chain

# Kept out of ci.yml on purpose. These checks answer "is anything we depend on known
# to be bad *today*", which changes without us pushing anything — so they run on a
# schedule, and on PRs only when a lockfile or manifest actually moves. Failing an
# unrelated PR for an advisory published overnight trains people to ignore red.
on:
  # The two path lists are duplicated because GitHub Actions does not support YAML
  # anchors — an `&anchor`/`*alias` pair parses locally and is rejected by Actions.
  push:
    branches: [main]
    paths:
      - "pnpm-lock.yaml"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "src-tauri/Cargo.lock"
      - "src-tauri/Cargo.toml"
      - "src-tauri/deny.toml"
      - ".github/workflows/supply-chain.yml"
  pull_request:
    paths:
      - "pnpm-lock.yaml"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "src-tauri/Cargo.lock"
      - "src-tauri/Cargo.toml"
      - "src-tauri/deny.toml"
      - ".github/workflows/supply-chain.yml"
  schedule:
    # 05:17 UTC daily. Off the hour because everyone schedules on the hour and the
    # runner queue is shorter a few minutes either side.
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # OSV covers both ecosystems from one database, which is why it is here rather than
  # `pnpm audit` + `cargo audit`: two tools, two output formats, two sets of excuses.
  #
  # `--config=osv-scanner.toml` carries the suppressions and the reasoning for each. They
  # are all the GTK 0.18 stack Tauri pulls in on Linux, all unreachable from this app, and
  # none upgradeable until Tauri moves. Every one carries an `ignoreUntil` so the argument
  # has to be made again rather than standing forever.
  #
  # Assembled from steps here rather than by calling osv-scanner's reusable workflow,
  # and that is not a style preference — the reusable one cannot run in this repo.
  #
  # `sha_pinning_required` is set on the repository, and GitHub enforces it *through*
  # a reusable workflow into the actions that workflow calls. Every version of
  # `osv-scanner-reusable.yml` up to and including v2.3.8 calls
  # `actions/download-artifact` by tag, so the job is refused before it starts:
  #
  #   The action actions/download-artifact@v8 is not allowed in gabmichels/lindo-md
  #   because all actions must be pinned to a full-length commit SHA.
  #
  # Which failed silently in the worst way — the PR variant has no such step, so PRs
  # stayed green while every scheduled run failed, and the daily "is anything we
  # depend on known-bad today" check was simply not running for two days.
  #
  # Upstream pinned it, but only in v2.5.0, released the same morning this was found.
  # Taking a hours-old third-party release into a job holding `security-events: write`
  # is exactly what `minimumReleaseAge` exists to refuse, so instead the scanner action
  # is called directly: it is self-contained, it is the same v2.3.8 the reusable
  # workflow was already running, and nothing here is younger than the age floor.
  #
  # The `osv-pr` job below still uses the reusable workflow, because that one *is*
  # fully pinned. Keep it that way — if it ever grows an unpinned step it will fail
  # the same way, and the fix is the same shape.
  osv:
    name: OSV scan
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Uploading SARIF to the Security tab. Free on public repos.
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `continue-on-error` because osv-scanner exits non-zero when it *finds*
      # something, and the SARIF still has to reach the Security tab when it does.
      # The explicit failure step at the end is what makes the job red — without it
      # this would report success on every vulnerability it found, which is the one
      # failure mode a security check must not have.
      - id: scan
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@8dc09193bb540e09b23da07ad7e30bd33bf87018 # v2.3.8
        with:
          scan-args: |-
            --config=osv-scanner.toml
            --format=sarif
            --output=results.sarif
            --lockfile=pnpm-lock.yaml
            --lockfile=src-tauri/Cargo.lock

      - uses: github/codeql-action/upload-sarif@18420e3271f74589575af831a523c833acda327f # codeql-bundle-v2.26.2
        with:
          sarif_file: results.sarif

      # Covers both "found advisories" and "the scanner itself failed". A scan that
      # could not run is not a pass.
      - name: Fail if the scan did not come back clean
        if: steps.scan.outcome == 'failure'
        run: |
          echo "osv-scanner reported findings or failed to run — see the step above" >&2
          exit 1

  # The PR variant reports only what this PR *introduces*, rather than every
  # pre-existing advisory in the tree. A PR author can act on the first and not the
  # second, and a check that lists things you cannot fix is a check you learn to skip.
  osv-pr:
    name: OSV scan (new only)
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
    with:
      scan-args: |-
        --config=osv-scanner.toml
        --lockfile=pnpm-lock.yaml
        --lockfile=src-tauri/Cargo.lock

  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # advisories: RustSec.   licenses: what we may ship inside a binary.
      # bans:       wildcards. sources:  crates.io and nothing else.
      # Config and reasoning live in src-tauri/deny.toml.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: src-tauri/Cargo.toml
          command: check advisories licenses bans sources
