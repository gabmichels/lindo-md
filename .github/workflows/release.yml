name: Release

# Triggered by a `v*` tag, which `pnpm release` creates — it derives the version from the commits
# since the last tag, so tags are not written by hand. See "Releasing" in AGENTS.md.
#
# Windows and Linux only, deliberately. All three platforms build fine in CI — macOS is not
# excluded for technical reasons — but an unsigned macOS bundle fails Gatekeeper with
# "lindo-md is damaged and can't be opened", which reads as a corrupt download rather than
# a security prompt, and generates bug reports instead of `xattr` invocations. Windows'
# SmartScreen at least states plainly what it is doing, and Linux has no gatekeeping at all.
#
# To add macOS later you need an Apple Developer Program membership for a Developer ID
# certificate and notarization — not a Mac, since the runners build it. Re-add the
# `macos-latest` matrix entry with `--target universal-apple-darwin` and supply the signing
# secrets; until then macOS users build from source, which the README covers.
#
# Windows and Linux bundles are still unsigned, so the release notes below carry the steps to
# open them. They live here rather than in the README: someone downloading a binary is reading
# the release page, not the repo.
#
# Two kinds of signature are in play here and they are not the same thing. There is no *code*
# signing certificate — that is the paid Authenticode/Developer ID kind, and its absence is what
# SmartScreen complains about. There is an *update* signing key: a minisign keypair whose public
# half sits in `tauri.conf.json` and whose private half exists only as the two secrets below.
# It costs nothing, and it is what makes an in-app updater safe for an unsigned project — a
# compromised release, a hijacked DNS answer or a proxy rewriting the manifest all produce an
# artifact this key did not sign, and `tauri-plugin-updater` refuses it in Rust before it runs.
#
# TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD are repository secrets. If they
# ever go missing the build does not fail quietly: `createUpdaterArtifacts` makes the bundler
# demand them.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  # Required by attest-build-provenance to sign the attestation.
  id-token: write
  attestations: write

jobs:
  release:
    name: Bundle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            args: "--bundles deb,rpm,appimage"
          # NSIS only — the `.msi` is deliberately no longer built.
          #
          # `latest.json` carries one installer per platform, and Tauri cannot tell which one a
          # given user originally ran. MSI and NSIS install to different locations under
          # different registry identities, so an MSI-installed copy updated from the NSIS
          # artifact becomes two copies of lindo-md rather than one upgraded one. NSIS is also
          # the one that can update without a UAC prompt every time (it installs per-user, into
          # %LOCALAPPDATA%), the one `installerHooks` below applies to, and the only one the
          # release notes have ever pointed at.
          - os: windows-latest
            args: "--bundles nsis"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release job talks to the API through GH_TOKEN, never through git
          # credentials — verified: nothing in this file runs `git push`/`commit`/`tag`.
          persist-credentials: false

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "lindo-md ${{ github.ref_name }}"
          releaseBody: |
            A Markdown viewer with editorial typography, full GitHub-flavored rendering
            (including Mermaid diagrams) and deeply customizable themes. Every document it
            renders is read from your own disk.

            ### Windows and Linux

            **These builds are unsigned**, so your OS will object the first time:

            - **Windows** — SmartScreen shows "Windows protected your PC". Choose
              **More info → Run anyway**.
            - **Linux** — mark the AppImage executable: `chmod +x lindo-md_*.AppImage`

            This is the last download you should need. From here lindo-md offers new versions
            itself and installs them in place — Settings → General has the switch if you would
            rather it did not ask, in which case the app makes no network requests at all.

            **If you installed the `.msi`**, uninstall it and use `lindo-md_*_x64-setup.exe`
            once. The MSI is no longer published: only one installer per platform can be
            offered as an update, and the two install to different places, so an MSI kept
            updating from the `.exe` would end up as two copies of the app.

            ### Verifying what you downloaded

            These builds carry no code-signing certificate, so verify them this way instead.

            Checksums are published as `checksums-*.txt`:

            ```sh
            sha256sum -c checksums-ubuntu-22.04.txt      # Linux
            ```
            ```powershell
            Get-FileHash .\lindo-md_*_x64-setup.exe -Algorithm SHA256   # Windows
            ```

            Every artifact also has signed build provenance tying it to this repository, commit
            and workflow run — stronger than a checksum, since it proves *where* the binary came
            from rather than only that it is intact:

            ```sh
            gh attestation verify <file> --repo gabmichels/lindo-md
            ```

            ### macOS

            No macOS build is published yet. It compiles fine, but an unsigned bundle fails
            Gatekeeper with "lindo-md is damaged and can't be opened" — which looks like a
            broken download rather than a security prompt. Homebrew removed `--no-quarantine` in
            5.1, so a cask is no longer a way around it either.

            Building from source avoids the problem entirely: a binary you compiled locally was
            never downloaded, so it is never quarantined.

            ```sh
            git clone https://github.com/gabmichels/lindo-md.git
            cd lindo-md && pnpm install && pnpm tauri build
            ```
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          # `includeUpdaterJson`, not `uploadUpdaterJson`. The rename exists — it is in the
          # action's own changelog — but not in the version pinned above, which still takes the
          # older name. v1.2.0 shipped with the newer one and Actions answered with
          # `##[warning]Unexpected input(s) 'uploadUpdaterJson'` and then carried on with the
          # default of `true`, because an unrecognised input is a warning and not an error. If
          # you ever change this line, read the inputs of the SHA that is actually pinned rather
          # than the docs for whatever is current.
          #
          # Off because the `Publish the updater manifest` job below writes the manifest
          # instead. The action's own is not wrong — v1.2.0's was complete and correct, since
          # it merges each runner's platforms into whatever is already on the release rather
          # than replacing it. What it cannot do is notice what is *absent*: if the Windows leg
          # dies before uploading, the Linux leg still publishes a manifest, and it is a valid
          # one that simply has no `windows-x86_64` key. Every Windows install then checks for
          # updates, is told there is nothing for its platform, and says so to nobody. The job
          # below refuses to write a manifest that is missing a platform, which is the only
          # part of this the action cannot do for us.
          includeUpdaterJson: false

      # Neither of the next two steps depends on a paid certificate, which is the point: they are
      # the trust signals available to an unsigned project. Checksums let anyone confirm the file
      # they downloaded is the file that was published; provenance ties that file to this repo,
      # this commit and this workflow run, verifiable with `gh attestation verify`.

      - name: Publish SHA256 checksums
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # tauri-action reports every artifact it uploaded; hashing those exact paths avoids
          # guessing at bundle layouts, which differ per platform and per tauri version.
          paths=$(echo '${{ steps.tauri.outputs.artifactPaths }}' | jq -r '.[]')
          [ -n "$paths" ] || { echo "no artifacts reported; nothing to checksum"; exit 0; }

          out="checksums-${{ matrix.os }}.txt"
          : > "$out"
          while IFS= read -r p; do
            # Strip a trailing CR before anything else looks at the value.
            #
            # This is what actually broke v1.0.0 and v1.1.0, and it is worth naming precisely
            # because the symptom is so misleading: a path carrying a CR *prints* correctly —
            # the carriage return just returns the cursor — so the error said "not found" next
            # to a path that was plainly right, and the previous fix went looking for a
            # backslash problem that was never there. `test -f` was being handed a filename
            # ending in a control character, and no such file exists.
            #
            # Only Windows is affected: the CR rides in on the action's output plumbing, so the
            # same expression is a no-op on Linux — which is why Linux checksums were always
            # complete and the Windows .msi silently vanished from v1.0.0's.
            p=${p%$'\r'}
            # tauri-action reports native Windows paths, so they need translating for a shell
            # that thinks in POSIX ones. `cygpath` is the translation MSYS uses on itself,
            # which beats substituting separators by hand and guessing at the drive syntax.
            # Absent on Linux, where the paths already are POSIX and need nothing done to them.
            if command -v cygpath >/dev/null 2>&1; then
              p=$(cygpath -u "$p")
            fi
            # A reported artifact that cannot be hashed is a broken release, not something to
            # skip: the file still reaches the release page, just with no checksum to check it
            # against, and that is indistinguishable from success unless it fails here.
            #
            # The listing is printed because this failure has now been diagnosed wrongly once.
            # Whatever the next cause turns out to be, the log should answer "then what *is*
            # in that directory?" without needing a second release to find out.
            [ -f "$p" ] || {
              echo "::error::artifact reported but not found: $p"
              echo "contents of $(dirname "$p"):"
              ls -la "$(dirname "$p")" || echo "  (directory does not exist)"
              exit 1
            }
            # Bare filenames, so `sha256sum -c` works from the directory of the downloads.
            (cd "$(dirname "$p")" && sha256sum "$(basename "$p")") >> "$GITHUB_WORKSPACE/$out"
          done <<< "$paths"

          # Every reported artifact must appear, so a silent truncation cannot ship again.
          expected=$(echo "$paths" | grep -c .)
          actual=$(grep -c . "$out")
          [ "$expected" = "$actual" ] || {
            echo "::error::expected $expected checksums, wrote $actual"; exit 1; }

          cat "$out"
          gh release upload "${{ github.ref_name }}" "$out" --clobber

      # Generated on the Linux runner only. The dependency tree is the same on every
      # platform — the lockfiles are — so doing it three times would produce three
      # identical files racing each other onto the release.
      #
      # `cdxgen` rather than the per-ecosystem tools: `@cyclonedx/cyclonedx-npm` shells
      # out to `npm ls`, which fails outright in a pnpm project, and using one tool for
      # both trees means one thing to pin rather than two. Verified by running it on
      # this repo — 725 components from the pnpm side, 556 from the cargo side.
      #
      # CycloneDX rather than SPDX because both `osv-scanner` and `grype` read it
      # directly. The point is that somebody who downloads a binary can ask what is
      # inside it without taking this repo's word for it.
      - name: Build a CycloneDX SBOM
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail

          # Pinned, and run through `dlx` rather than added to package.json: a tool only
          # the release uses is still a dependency in everyone's lockfile if it goes there.
          pnpm dlx @cyclonedx/cdxgen@11.11.0 -t pnpm -o sbom-frontend.cdx.json --spec-version 1.5
          (cd src-tauri && pnpm dlx @cyclonedx/cdxgen@11.11.0 -t rust -o ../sbom-rust.cdx.json --spec-version 1.5)

          for f in sbom-frontend.cdx.json sbom-rust.cdx.json; do
            components=$(jq '.components | length' "$f")
            echo "$f: $components components"
            # An SBOM listing nothing is worse than no SBOM: it answers the question
            # wrongly rather than declining to answer it.
            [ "$components" -gt 0 ] || { echo "::error::$f lists no components"; exit 1; }
          done

      - name: Publish the SBOM
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${{ github.ref_name }}"             sbom-frontend.cdx.json sbom-rust.cdx.json --clobber

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          # subject-path takes a comma- or newline-separated list; a GitHub Actions expression
          # cannot emit a literal newline, so comma it is.
          subject-path: ${{ join(fromJSON(steps.tauri.outputs.artifactPaths), ',') }}

  # What every installed copy of lindo-md reads to decide whether to update, and what to
  # download when it does. It runs after both bundles exist, for the reason spelled out at
  # `includeUpdaterJson: false` above: the action's own manifest is accurate about the
  # artifacts it can see and silent about the ones that were never built.
  #
  # `needs` without `if: success()` is deliberate — a matrix leg that failed means one
  # platform has no bundle, and `scripts/updater-manifest.mjs` refuses to write a manifest
  # with a platform missing rather than publishing one that silently strands those users.
  # This job being skipped is the correct outcome of a half-finished release: the previous
  # version's manifest stays in place, and everyone keeps being offered a release that
  # exists, until a human looks at why the build failed.
  #
  # The manifest itself is not signed, and does not need to be for the property that matters:
  # every URL in it points at an artifact whose minisign signature the client verifies before
  # running it, so a rewritten manifest cannot deliver code this repo did not build. What it
  # could do is name an *older* release — a downgrade — which is a real if narrow attack, and
  # the honest mitigation today is that the file is served by GitHub over TLS from a release
  # only this workflow's token can write.
  updater-manifest:
    name: Publish the updater manifest
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Build latest.json from the release artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # The installers and the minisign signature written beside each one. Drafts are
          # reachable by tag through the API, which is the whole reason this can run before
          # the release is published — the manifest has to be in place the moment it is.
          mkdir -p updater-assets
          gh release download "$TAG" --dir updater-assets \
            --pattern '*-setup.exe' --pattern '*-setup.exe.sig' \
            --pattern '*.AppImage' --pattern '*.AppImage.sig'

          ls -la updater-assets

          # The version without the `v`, which is what the updater compares against
          # `getVersion()` — a manifest saying "v1.2.0" never matches "1.2.0" and every
          # client concludes it is already current.
          version="${TAG#v}"

          # The tagged commit's own date rather than the clock: a re-run of this job must
          # produce the same bytes as the first, or the published manifest changes under
          # clients for no reason. `HEAD` rather than "$TAG" because a tag-triggered
          # checkout is shallow and the tag object itself may not have been fetched — HEAD
          # is the commit the tag points at either way.
          pub_date=$(git log -1 --format=%cI HEAD)

          node scripts/updater-manifest.mjs \
            --dir updater-assets \
            --version "$version" \
            --tag "$TAG" \
            --repo "${{ github.repository }}" \
            --notes "lindo-md $version" \
            --pub-date "$pub_date" > latest.json

          cat latest.json

          gh release upload "$TAG" latest.json --clobber
