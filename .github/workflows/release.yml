name: Release

# Triggered by a `v*` tag, which `pnpm release` creates — it derives the version from the commits
# since the last tag, so tags are not written by hand. See "Releasing" in AGENTS.md.
#
# Windows and Linux only, deliberately. All three platforms build fine in CI — macOS is not
# excluded for technical reasons — but an unsigned macOS bundle fails Gatekeeper with
# "lindo-md is damaged and can't be opened", which reads as a corrupt download rather than
# a security prompt, and generates bug reports instead of `xattr` invocations. Windows'
# SmartScreen at least states plainly what it is doing, and Linux has no gatekeeping at all.
#
# To add macOS later you need an Apple Developer Program membership for a Developer ID
# certificate and notarization — not a Mac, since the runners build it. Re-add the
# `macos-latest` matrix entry with `--target universal-apple-darwin` and supply the signing
# secrets; until then macOS users build from source, which the README covers.
#
# Windows and Linux bundles are still unsigned, so the release notes below carry the steps to
# open them. They live here rather than in the README: someone downloading a binary is reading
# the release page, not the repo.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  # Required by attest-build-provenance to sign the attestation.
  id-token: write
  attestations: write

jobs:
  release:
    name: Bundle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            args: ""
          - os: windows-latest
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release job talks to the API through GH_TOKEN, never through git
          # credentials — verified: nothing in this file runs `git push`/`commit`/`tag`.
          persist-credentials: false

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "lindo-md ${{ github.ref_name }}"
          releaseBody: |
            A Markdown viewer with editorial typography, full GitHub-flavored rendering
            (including Mermaid diagrams) and deeply customizable themes. Works entirely offline.

            ### Windows and Linux

            **These builds are unsigned**, so your OS will object the first time:

            - **Windows** — SmartScreen shows "Windows protected your PC". Choose
              **More info → Run anyway**.
            - **Linux** — mark the AppImage executable: `chmod +x lindo-md_*.AppImage`

            ### Verifying what you downloaded

            These builds carry no code-signing certificate, so verify them this way instead.

            Checksums are published as `checksums-*.txt`:

            ```sh
            sha256sum -c checksums-ubuntu-22.04.txt      # Linux
            ```
            ```powershell
            Get-FileHash .\lindo-md_*_x64-setup.exe -Algorithm SHA256   # Windows
            ```

            Every artifact also has signed build provenance tying it to this repository, commit
            and workflow run — stronger than a checksum, since it proves *where* the binary came
            from rather than only that it is intact:

            ```sh
            gh attestation verify <file> --repo gabmichels/lindo-md
            ```

            ### macOS

            No macOS build is published yet. It compiles fine, but an unsigned bundle fails
            Gatekeeper with "lindo-md is damaged and can't be opened" — which looks like a
            broken download rather than a security prompt. Homebrew removed `--no-quarantine` in
            5.1, so a cask is no longer a way around it either.

            Building from source avoids the problem entirely: a binary you compiled locally was
            never downloaded, so it is never quarantined.

            ```sh
            git clone https://github.com/gabmichels/lindo-md.git
            cd lindo-md && pnpm install && pnpm tauri build
            ```
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # Neither of the next two steps depends on a paid certificate, which is the point: they are
      # the trust signals available to an unsigned project. Checksums let anyone confirm the file
      # they downloaded is the file that was published; provenance ties that file to this repo,
      # this commit and this workflow run, verifiable with `gh attestation verify`.

      - name: Publish SHA256 checksums
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # tauri-action reports every artifact it uploaded; hashing those exact paths avoids
          # guessing at bundle layouts, which differ per platform and per tauri version.
          paths=$(echo '${{ steps.tauri.outputs.artifactPaths }}' | jq -r '.[]')
          [ -n "$paths" ] || { echo "no artifacts reported; nothing to checksum"; exit 0; }

          out="checksums-${{ matrix.os }}.txt"
          : > "$out"
          while IFS= read -r p; do
            # tauri-action reports native Windows paths; Git Bash's `test -f` rejects some
            # backslash forms that the Win32 API itself accepts, which silently dropped the
            # .msi from v1.0.0's checksums. Forward slashes are understood on both platforms,
            # and this is a no-op on Linux's already-forward paths.
            #
            # `tr` rather than `${p//\\//}`: that expansion is a silent no-op in the MSYS bash
            # these runners use. '\134' is octal for the backslash, which avoids tr's
            # "unescaped backslash at end of string" warning.
            p=$(printf '%s' "$p" | tr '\134' '/')
            # A reported artifact that cannot be hashed is a broken release, not something to
            # skip: the file still reaches the release page, just with no checksum to check it
            # against, and that is indistinguishable from success unless it fails here.
            [ -f "$p" ] || { echo "::error::artifact reported but not found: $p"; exit 1; }
            # Bare filenames, so `sha256sum -c` works from the directory of the downloads.
            (cd "$(dirname "$p")" && sha256sum "$(basename "$p")") >> "$GITHUB_WORKSPACE/$out"
          done <<< "$paths"

          # Every reported artifact must appear, so a silent truncation cannot ship again.
          expected=$(echo "$paths" | grep -c .)
          actual=$(grep -c . "$out")
          [ "$expected" = "$actual" ] || {
            echo "::error::expected $expected checksums, wrote $actual"; exit 1; }

          cat "$out"
          gh release upload "${{ github.ref_name }}" "$out" --clobber

      # Generated on the Linux runner only. The dependency tree is the same on every
      # platform — the lockfiles are — so doing it three times would produce three
      # identical files racing each other onto the release.
      #
      # `cdxgen` rather than the per-ecosystem tools: `@cyclonedx/cyclonedx-npm` shells
      # out to `npm ls`, which fails outright in a pnpm project, and using one tool for
      # both trees means one thing to pin rather than two. Verified by running it on
      # this repo — 725 components from the pnpm side, 556 from the cargo side.
      #
      # CycloneDX rather than SPDX because both `osv-scanner` and `grype` read it
      # directly. The point is that somebody who downloads a binary can ask what is
      # inside it without taking this repo's word for it.
      - name: Build a CycloneDX SBOM
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail

          # Pinned, and run through `dlx` rather than added to package.json: a tool only
          # the release uses is still a dependency in everyone's lockfile if it goes there.
          pnpm dlx @cyclonedx/cdxgen@11.11.0 -t pnpm -o sbom-frontend.cdx.json --spec-version 1.5
          (cd src-tauri && pnpm dlx @cyclonedx/cdxgen@11.11.0 -t rust -o ../sbom-rust.cdx.json --spec-version 1.5)

          for f in sbom-frontend.cdx.json sbom-rust.cdx.json; do
            components=$(jq '.components | length' "$f")
            echo "$f: $components components"
            # An SBOM listing nothing is worse than no SBOM: it answers the question
            # wrongly rather than declining to answer it.
            [ "$components" -gt 0 ] || { echo "::error::$f lists no components"; exit 1; }
          done

      - name: Publish the SBOM
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "${{ github.ref_name }}"             sbom-frontend.cdx.json sbom-rust.cdx.json --clobber

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          # subject-path takes a comma- or newline-separated list; a GitHub Actions expression
          # cannot emit a literal newline, so comma it is.
          subject-path: ${{ join(fromJSON(steps.tauri.outputs.artifactPaths), ',') }}
