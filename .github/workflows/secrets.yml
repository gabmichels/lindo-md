name: Secret scan

# Complements GitHub's own push protection rather than replacing it. Push protection
# stops a known-shaped credential reaching the remote at all, and is switched on (see
# docs/repo-settings.md); this scans what is *already* in the history, which push
# protection never saw, and catches shapes its partner patterns do not cover.
#
# Worth having in a repo that ships a desktop app: signing certificates and notarization
# credentials are the obvious future additions to this project, and both are exactly the
# kind of thing that gets pasted into a workflow "just to test it".
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, not the default single commit: a credential committed
          # two years ago and "removed" in the next commit is still in the pack, still
          # reachable, and still valid unless it was rotated.
          fetch-depth: 0
          persist-credentials: false

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No licence key is needed while this repo belongs to a personal account.
          # It becomes required if it ever moves under an organization — at which
          # point this job starts failing, and the fix is a free key from gitleaks.io
          # rather than deleting the job.
