<!doctype html>
<!--
  The component attributes carry House's defaults, for the same reason styles.css
  duplicates House's `--doc-*` values: `document.css` selects a quote or a code
  block's shape by attribute, and an unstamped root matches none of those rules —
  so the first paint before React mounts would draw a quotation with no mark at
  all. `theme.test.ts` fails if this drifts from what `componentAttributes` writes.
-->
<html
  lang="en"
  data-heading-rule="none"
  data-heading-minor="uppercase"
  data-quote="bar"
  data-rule="line"
  data-code-block="card"
  data-code-inline="tint"
  data-alert="bar"
  data-list="default"
  data-table-head="uppercase"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>lindo-md</title>
    <!-- The chrome's base plane, duplicated from `--ui-base` in styles.css and from
         the window's `backgroundColor` in tauri.conf.json. The webview paints white
         until a stylesheet arrives, and in dev that stylesheet comes from a module
         graph — so without this the first frame is a white rectangle. -->
    <style>
      html,
      body {
        background: #111419;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
