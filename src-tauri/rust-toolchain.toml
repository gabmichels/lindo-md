# The one place the Rust version is decided. CI reads `channel` from here and hands it
# to dtolnay/rust-toolchain (which does not read this file itself), so a job installs
# exactly this toolchain and nothing else. Renovate bumps it in its own PR, which is
# where a new clippy lint should turn up — not in an unrelated change. See AGENTS.md.
[toolchain]
channel = "1.100.0"
components = ["clippy", "rustfmt"]
profile = "minimal"
