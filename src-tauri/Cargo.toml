[package]
name = "lindo-md"
version = "1.0.0"
description = "A beautiful, offline Markdown viewer with editorial typography and deeply customizable themes"
authors = ["lindo-md contributors"]
license = "MIT"
repository = "https://github.com/gabmichels/lindo-md"
edition = "2021"
# No `rust-version`. The 1.82 that used to be declared here was untrue — `globset`
# alone now ships a manifest that 1.82's cargo cannot parse — and an MSRV is a promise
# to people compiling this as a dependency, which nobody does: lindo-md ships as a
# binary. Track stable rather than defend a number no test checks.

# A panic here is not an error message — `panic = "abort"` is set in the release profile
# below, so any panic reachable from a document takes the window down with every open tab.
# The four restriction lints make that class of code impossible to add without saying so.
#
# Turning them on cost exactly three `#[allow]`s across the whole crate, each provably
# safe: a `binary_search` hit being indexed, a `write!` into a `String`, and the top-level
# `run()`. That is the point — the exceptions are now visible and argued rather than
# spread through the file as ordinary-looking calls.
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }

unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"

# Tauri command handlers take owned `String`s because that is the signature the macro
# generates; rewriting them to take `&str` is not possible.
needless_pass_by_value = "allow"
# Wants backticks around every identifier-shaped word in a doc comment. The comments in
# this crate are prose written for a reader, and that is deliberate.
doc_markdown = "allow"
# `Config` having several booleans is what a settings struct is.
struct_excessive_bools = "allow"

[lib]
name = "lindo_md_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
log = "0.4"
tauri-plugin-log = "2"

# Markdown pipeline: comrak parses GFM, ammonia sanitizes the resulting HTML.
# `unsafe_` rendering is enabled in markdown.rs so <details>/<kbd> survive, which
# makes the ammonia pass mandatory rather than optional.
comrak = { version = "0.44", features = ["shortcodes"] }
ammonia = "4"
# The HTML5 entity table, so `srcmap` decodes exactly what comrak does. Already
# in the tree as a comrak dependency; naming it here makes that reliance explicit
# rather than accidental.
entities = "1"
# Content fingerprints: which file a save expected, and whether a filesystem
# event is just our own write coming back. Not a security primitive.
sha2 = "0.10"

# Folder scanning (respects .gitignore) and live reload.
ignore = "0.4"
notify = "8"
tauri-plugin-os = "2.3.2"
tauri-plugin-single-instance = "2.4.3"
# Window geometry across launches. Its own state file, not `config.rs`: this is
# remembered window chrome, not a setting anyone chooses in the UI.
tauri-plugin-window-state = "2"

# Reading which application owns `.md`. Writing it is not possible — see
# `src/defaults.rs` — so this is a read-only dependency on the registry.
[target.'cfg(windows)'.dependencies]
windows-registry = "0.5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
