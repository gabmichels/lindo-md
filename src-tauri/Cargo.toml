[package]
name = "pretty-md"
version = "0.1.0"
description = "A beautiful, offline Markdown viewer with editorial typography and deeply customizable themes"
authors = ["pretty-md contributors"]
license = "MIT"
repository = "https://github.com/gabmichels/pretty-md"
edition = "2021"
rust-version = "1.82"

[lib]
name = "pretty_md_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
log = "0.4"
tauri-plugin-log = "2"

# Markdown pipeline: comrak parses GFM, ammonia sanitizes the resulting HTML.
# `unsafe_` rendering is enabled in markdown.rs so <details>/<kbd> survive, which
# makes the ammonia pass mandatory rather than optional.
comrak = { version = "0.44", features = ["shortcodes"] }
ammonia = "4"

# Folder scanning (respects .gitignore) and live reload.
ignore = "0.4"
notify = "8"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
