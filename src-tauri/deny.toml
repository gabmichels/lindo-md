# cargo-deny: the Rust half of the dependency floor. The npm half is osv-scanner
# plus pnpm's `minimumReleaseAge` — see `pnpm-workspace.yaml`.
#
# Run locally with `cargo deny check` from `src-tauri/`.

[graph]
# lindo-md ships a desktop binary for exactly these three, so a crate that is only
# ever compiled for wasm or android is not part of what we ship and not worth
# failing a build over.
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-unknown-linux-gnu",
]

[advisories]
# Every vulnerability advisory is an error; that is not configurable and should not be.
# `unmaintained = "workspace"` limits the *unmaintained* signal to crates we depend on
# directly. Applied to the whole transitive tree it is mostly noise from deep in the
# GTK/webkit stack, which we can neither fix nor drop, and a check that is always red
# is a check nobody reads.
unmaintained = "workspace"
yanked = "deny"
unused-ignored-advisory = "warn"
ignore = []

[licenses]
# lindo-md is MIT and ships a binary that statically links this whole tree, so the
# allow-list is "licenses compatible with distributing a permissively-licensed
# binary". A copyleft crate appearing here should be a decision, not a surprise —
# which is what this check makes it.
confidence-threshold = 0.93
unused-allowed-license = "allow"
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unicode-3.0",
    "Unlicense",
    "BSL-1.0",
    # Weak copyleft, file-level. Fine to link into a permissive binary; not fine to
    # copy source out of. `webkit2gtk`-adjacent crates and `option-ext` use it.
    "MPL-2.0",
]

# Scoped to the one crate rather than added to `allow`: MITNFA is MIT plus a
# no-false-attribution clause, which is fine to ship, but allowing it globally would
# wave through the next crate that picks an unusual licence without anyone looking.
[[licenses.exceptions]]
crate = "fmt2io"
allow = ["MITNFA"]

[licenses.private]
# lindo-md itself is unpublished; its own license is declared in Cargo.toml.
ignore = true

[bans]
multiple-versions = "warn"
# A wildcard version is an open door for whatever gets published next.
wildcards = "deny"
allow-wildcard-paths = true
deny = []
skip = []
skip-tree = []

[sources]
# The point of this section. A dependency that resolves to anything other than
# crates.io — a git URL, a private registry — is either a mistake or an attack, and
# either way it should not build silently.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
