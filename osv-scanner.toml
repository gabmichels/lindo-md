# --- The one with a score -----------------------------------------------------
#
# The only entry here that is not simply an unmaintained notice, so it gets its own
# reasoning rather than a shared one.
#
# glib 0.18.5, CVSS 6.9. RustSec classifies it "INFO Unsound": `VariantStrIter` passed
# an immutable reference to a pointer that the C function behind it mutates in place,
# so iterating one could dereference null. Reaching it requires calling `next`,
# `nth`, `last` and friends on a `VariantStrIter` — which this app never does, directly
# or otherwise; it is internal to the GTK bindings.
#
# Fixed in glib 0.20.0, which gtk 0.18 cannot take. Revisit when Tauri moves.

# Keyed by the GHSA id, not RUSTSEC-2024-0429: osv-scanner reports this finding under
# the GitHub alias, and an entry for the RustSec id never matches. It says so —
# "osv-scanner.toml has unused ignores" — which is worth listening to, because an ignore
# that matches nothing looks like coverage and is not.
[[IgnoredVulns]]
id = "GHSA-wrw7-89jp-8q8g"
ignoreUntil = 2027-02-01
reason = "glib 0.18.5 VariantStrIter unsoundness (RUSTSEC-2024-0429); unreachable from this app, fixed only in glib 0.20 which gtk 0.18 cannot take"
