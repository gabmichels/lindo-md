# What osv-scanner is told to stop reporting, and why.
#
# Every entry here is in the GTK 0.18 stack that Tauri pulls in for its Linux webview,
# and every one is unreachable from this repository: the chain is
# `glib <- atk <- gtk 0.18 <- muda <- tauri 2.11`. `cargo update -p glib` locks zero
# packages, because gtk 0.18 requires glib ^0.18 — none of this moves until Tauri moves
# to gtk 0.19, which is not a decision this project gets to make.
#
# This file exists because the workflow was red on `main` while `cargo-deny` was green
# on the same tree, which is an inconsistency in *this repo's configuration*, not a
# disagreement between the tools. `deny.toml` already sets `unmaintained = "workspace"`
# with the reasoning written next to it — that unmaintained notices from deep in the
# GTK stack are noise we can neither fix nor drop, and a check that is always red is a
# check nobody reads. That reasoning was never applied to osv-scanner. It is now.
#
# `ignoreUntil` on every entry, deliberately. A suppression with no expiry is a decision
# nobody revisits; these come back in six months and have to be argued for again. If
# Tauri has moved by then, the fix is to delete the entry rather than extend the date.
#
# Nothing here is a judgement that the advisory is wrong. Adding an entry means: this is
# real, it is unreachable from here, and we cannot act on it.

# --- Unmaintained: the gtk-rs bindings ----------------------------------------
#
# RUSTSEC-2024-0411 through -0420 are one announcement split across the crates it
# covers: the gtk3 bindings are no longer maintained. They are Linux-only, they are
# Tauri's dependency rather than ours, and there is no successor to move to at 0.18.

[[IgnoredVulns]]
id = "RUSTSEC-2024-0411"
ignoreUntil = 2027-02-01
reason = "gdkwayland-sys: gtk-rs bindings unmaintained; transitive via tauri, Linux only, no upgrade path at gtk 0.18"

