  <rect x="272" y="208" width="480" height="608" rx="32" fill="#FAF8F4" />
  <g fill="#C9C4BB">
    <rect x="344" y="316" width="336" height="36" rx="18" />
    <rect x="344" y="396" width="280" height="36" rx="18" />
    <rect x="344" y="556" width="300" height="36" rx="18" />
    <rect x="344" y="636" width="200" height="36" rx="18" />
  </g>
  <rect x="344" y="476" width="336" height="36" rx="18" fill="#E8A03C" />
